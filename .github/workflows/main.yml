name: Build im-control

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Install (collect binaries into bin/)
        run: cmake --install build --prefix bin --config RelWithDebInfo

      - name: List output
        run: dir bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: im-control-${{ github.sha }}
          path: bin/**
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Install (collect binaries into bin/)
        run: cmake --install build --prefix bin --config RelWithDebInfo

      - name: Zip binaries
        run: Compress-Archive -Path bin\* -DestinationPath im-control-${{ github.ref_name }}-win64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: im-control-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
